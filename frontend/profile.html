<!doctype html>
<html>
  <head>
    <title>Create Profile</title>
    <link rel="stylesheet" href="profile.css" />
  </head>

  <body>
    <div class="profile-container">
      <h2>Build Your Profile</h2>

      <form onsubmit="createProfile(event)">
        <label>College / University</label>
        <input
          type="text"
          id="college"
          placeholder="Enter college name"
          required
        />

        <label>Degree</label>
        <input type="text" id="degree" placeholder="B.Tech" required />

        <!-- Branch + Year in same row -->

        <div class="row">
          <div class="field">
            <label>Branch</label>
            <select id="branch">
              <option value="">Select Branch</option>
              <option>Computer Science</option>
              <option>Information Technology</option>
              <option>Electronics & Communication</option>
              <option>Electrical Engineering</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
              <option>Artificial Intelligence</option>
              <option>Data Science</option>
            </select>
          </div>

          <div class="field">
            <label>Year</label>
            <select id="year">
              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>

        <label>Skills</label>
        <input type="text" id="skills" placeholder="HTML, Python" />

        <label>Career Goal</label>
        <input type="text" id="goal" placeholder="AI Engineer" />

        <button class="primary-btn" type="submit">Create My Profile</button>
      </form>
    </div>

    <script src="profile.js"></script>
  </body>
</html>
